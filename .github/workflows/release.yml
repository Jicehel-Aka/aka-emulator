name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  QEMU_FLAGS: --target-list=xtensa-softmmu --disable-docs --disable-tools --disable-user --disable-gtk --disable-vnc --disable-sdl --disable-werror --disable-slirp --disable-debug-info

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build pkg-config python3-venv libglib2.0-dev libpixman-1-dev libfdt-dev libsdl2-dev libgcrypt20-dev zlib1g-dev
      - name: Fork QEMU Espressif + patch AKA
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/espressif/qemu.git qemu
          cd qemu && git checkout "$(tr -d '\r\n' < ../qemu-patch/BASE_COMMIT)" && tr -d '\r' < ../qemu-patch/aka-qemu.patch | git apply --whitespace=nowarn
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ hashFiles('qemu-patch/aka-qemu.patch') }}
      - name: Compile QEMU (release, LTO)
        run: |
          mkdir -p qemu/build && cd qemu/build
          ../configure $QEMU_FLAGS --enable-fdt=system --enable-lto --extra-cflags="-O3"
          ninja qemu-system-xtensa
      - name: Compile le front-end
        run: g++ -O2 -std=c++17 front/main.cpp front/flashimg.cpp -o aka-front $(sdl2-config --cflags --libs)
      - name: Package
        run: |
          D=aka-emulator-linux-x64
          mkdir -p $D/bin/pc-bios
          strip -o $D/bin/qemu-system-xtensa qemu/build/qemu-system-xtensa
          cp qemu/pc-bios/esp32s3_rev0_rom.bin $D/bin/pc-bios/
          cp aka-front $D/bin/
          cp -r sample front tools windows qemu-patch $D/
          cp dist-template/README.md $D/ ; cp dist-template/linux/* $D/ ; chmod +x $D/run.sh
          cp aka-launcher.zip mode-emploi-launcher-aka.pdf $D/ 2>/dev/null || true
          tar czf $D.tar.gz $D
      - uses: actions/upload-artifact@v4
        with:
          name: aka-linux
          path: aka-emulator-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    continue-on-error: true      # le build QEMU/MSYS2 n'est pas bloquant pour la release Linux
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git base-devel ninja python
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-glib2 mingw-w64-x86_64-pixman
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-python-setuptools
            mingw-w64-x86_64-meson mingw-w64-x86_64-dtc mingw-w64-x86_64-libgcrypt
      - name: Fork QEMU Espressif + patch AKA
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/espressif/qemu.git qemu
          cd qemu && git checkout "$(tr -d '\r\n' < ../qemu-patch/BASE_COMMIT)" && tr -d '\r' < ../qemu-patch/aka-qemu.patch | git apply --whitespace=nowarn
      - name: Compile QEMU + front-end
        run: |
          sed -i 's/\r$//' windows/*.sh
          bash windows/build-qemu-msys2.sh
          bash windows/build-front-msys2.sh
      - name: Package
        run: |
          D=aka-emulator-windows-x64
          mkdir -p $D/bin
          cp -r windows/dist/qemu/. $D/bin/
          cp windows/dist/aka-front.exe windows/dist/SDL2.dll $D/bin/
          mkdir -p $D/bin/pc-bios && cp qemu/pc-bios/esp32s3_rev0_rom.bin $D/bin/pc-bios/
          cp -r sample front tools qemu-patch $D/
          cp dist-template/README.md $D/ ; cp dist-template/windows/* $D/
          cp aka-launcher.zip mode-emploi-launcher-aka.pdf $D/ 2>/dev/null || true
      - name: Zip (PowerShell, natif Windows)
        shell: pwsh
        run: Compress-Archive -Path aka-emulator-windows-x64 -DestinationPath aka-emulator-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aka-windows
          path: aka-emulator-windows-x64.zip

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'aka-*'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
